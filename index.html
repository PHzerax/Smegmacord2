html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--bone);font:400 15px/1.45 Archivo,system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--dim)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.brand{font-family:"Rubik Distressed",Impact,sans-serif;font-weight:400}
.sticker{background:#fff var(--logo) center/90% no-repeat;border-radius:50%;flex:none}
.go{background:var(--bone);color:#1b1a19;border-color:var(--bone);font-weight:800}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;padding:24px;overflow:auto}
.gin{display:grid;gap:14px;justify-items:center;text-align:center;max-width:360px;width:100%}
.gin .sticker{width:min(62vw,240px);aspect-ratio:1;border-radius:26px;background-size:86%;transform:rotate(-4deg)}
.gin h1{font-size:48px;margin:6px 0 0;line-height:1}
.gin p{margin:0;color:var(--dim)}
.gin input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.gin .go{width:100%;padding:12px}
.app{display:grid;grid-template-columns:268px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.head .sticker{width:46px;height:46px}
.head .brand{font-size:26px}
.chs{flex:1;overflow:auto;padding:10px 8px}
.chs h2{font-size:13px;font-weight:600;color:var(--dim);margin:14px 8px 6px}
.ch{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 10px;color:var(--dim)}
.ch:hover,.ch.on{background:var(--raise);color:var(--bone)}
.who{margin:2px 0 8px 22px;display:grid;gap:4px;font-size:14px}
.who i{font-style:normal;display:flex;gap:8px;align-items:center}
.who b{width:8px;height:8px;border-radius:50%;background:var(--live)}
.dock{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.menu{display:none;padding:4px 10px}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#1b1a19;font-weight:800;flex:none}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg time{color:var(--dim);font-size:12px;margin-left:8px;font-weight:400}
.empty{margin:auto;color:var(--dim);text-align:center}
.send{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.send textarea{flex:1;resize:none;height:44px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
#call:not(.on){position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
#call{flex:1;display:flex;flex-direction:column;min-height:0}
#idle{margin:auto;display:grid;gap:12px;justify-items:center;text-align:center;padding:24px}
#live{flex:1;display:flex;flex-direction:column;min-height:0}
.people{display:flex;flex-wrap:wrap;gap:10px;padding:16px}
.pp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px}
.pp .av{width:30px;height:30px}
.screens{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;padding:0 16px 16px;overflow:auto;align-content:start}
.tile{position:relative;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile video{width:100%;max-height:70vh;display:block}
.tile span{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.72);padding:2px 10px;border-radius:999px;font-size:13px;display:flex;gap:6px;align-items:center}
.tile span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.tile.hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}
.ctl .act{background:var(--bone);color:#1b1a19;border-color:var(--bone)}
.ctl .leave{background:var(--live);border-color:var(--live);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bone);color:#1b1a19;padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw}
.back{display:none}
@media(max-width:760px){
.app{grid-template-columns:1fr}
.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
.app.open .side{transform:none}
.menu{display:inline-block}
.app.open .back{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div id="gate"><div class="gin">
<div class="sticker" role="img" aria-label="Logo do smegmacord"></div>
<h1 class="brand">smegmacord</h1>
<p>Chat e calls com compartilhamento de tela, só pra galera.</p>
<input id="nick" maxlength="20" placeholder="Seu apelido" aria-label="Seu apelido" autocomplete="off">
<button class="go" id="enter">Entrar</button>
<p id="warn"></p>
</div></div>
<div class="app" id="app" hidden>
<div class="back" id="back"></div>
<aside class="side">
<div class="head"><div class="sticker" role="img" aria-label="Logo"></div><span class="brand">smegmacord</span></div>
<nav class="chs" id="chs"></nav>
<div class="dock" id="dock"></div>
</aside>
<main>
<div class="bar"><button class="menu" id="menu" aria-label="Abrir canais">☰</button><span id="title"></span><span id="online" style="margin-left:auto;color:var(--dim);font-weight:400"></span></div>
<section class="view" id="chat">
<div class="msgs" id="msgs"></div>
<div class="send"><textarea id="txt" placeholder="Escreva uma mensagem" aria-label="Mensagem"></textarea><button class="go" id="snd">Enviar</button></div>
</section>
<section id="call">
<div id="idle"><div class="sticker" style="width:96px;height:96px" role="img" aria-label="Logo"></div><p id="idletxt"></p><button class="go" id="join">Entrar na call</button></div>
<div id="live" hidden>
<div class="people" id="people"></div>
<div class="screens" id="screens"></div>
<div class="ctl"><button id="mute">Silenciar microfone</button><button id="share">Compartilhar tela</button><button class="leave" id="leave">Sair da call</button></div>
</div>
</section>
</main>
</div>
<script>
(()=>{const me=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const post=async b=>{const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({peer:me,...b})});if(!r.ok)throw new Error('http '+r.status)};
const chans=new Map(),subs=new Map();
class Chan{constructor(n){this.name=n;this.ls={};this.pl=new Set();this.ps=[]}
emit(t,d){return post({op:'emit',room:this.name,topic:t,data:d})}
on(t,f){(this.ls[t]=this.ls[t]||new Set()).add(f);return()=>this.ls[t].delete(f)}
presence(p){return post({op:'presence',room:this.name,patch:p})}
peers(){return this.ps}
onPeers(f){this.pl.add(f);f({peers:this.ps});return()=>this.pl.delete(f)}
async leave(){chans.delete(this.name);await post({op:'leave',room:this.name})}}
const lobby=new Chan('');chans.set('',lobby);
lobby.join=async n=>{let c=chans.get(n);if(!c){c=new Chan(n);chans.set(n,c);try{await post({op:'join',room:n})}catch(e){chans.delete(n);throw e}}return c};
const es=new EventSource('/events?peer='+me);
es.onmessage=e=>{const m=JSON.parse(e.data),c=chans.get(m.room);
if(m.t==='peers'&&c){c.ps=m.peers.map(p=>({peer:p.peer,presence:p.presence||{},isMe:p.peer===me,sameTab:p.peer===me,kind:'viewer'}));c.pl.forEach(f=>f({peers:c.ps}))}
else if(m.t==='msg'&&c){const s=c.ls[m.topic];s&&s.forEach(f=>f({topic:m.topic,data:m.data,peer:m.from,isMe:false,sameTab:false,kind:'viewer'}))}
else if(m.t==='chat'){const f=subs.get(m.channel);f&&f({docs:m.docs.map(d=>({data:()=>d}))})}};
const D={collection:p=>{const ch=p.split('/')[1],q={orderBy:()=>q,limit:()=>q,
onSnapshot(cb){subs.set(ch,cb);post({op:'sub',channel:ch}).catch(()=>{});return()=>{if(subs.get(ch)===cb)subs.delete(ch)}},
add:d=>post({op:'add',channel:ch,doc:d})};return q}};
window.claude={use:n=>Promise.resolve(n==='room'?lobby:n==='db'?D:null)}})();
</script>
<script>
const $=s=>document.querySelector(s),H=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const TXT=['geral','memes','jogos','papo-livre'],VOZ=['Sala 1','Sala 2','Sala 3'];
const use=n=>window.claude&&claude.use?claude.use(n).catch(()=>null):Promise.resolve(null);
let room=null,db=null,nick='',cur={t:'txt',i:0},unsub=null,call=null,lobby=[];
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const av=n=>{const a=H('span','av',(n[0]||'?').toUpperCase());a.style.background='hsl('+hue(n)+' 55% 68%)';return a};
const toast=m=>{const t=H('div','toast',m);t.setAttribute('role','status');document.body.append(t);setTimeout(()=>t.remove(),5000)};
const nm=p=>String((p&&p.presence&&p.presence.name)||'?').slice(0,20);
const ready=Promise.all([use('room'),use('db')]).then(([r,d])=>{room=r;db=d;if(!r||!d)$('#warn').textContent='Sem conexão com o servidor. Recarregue a página.'});
$('#nick').value=ls.get('nick');
$('#enter').onclick=enter;$('#nick').onkeydown=e=>{if(e.key==='Enter')enter()};
$('#menu').onclick=()=>$('#app').classList.toggle('open');$('#back').onclick=()=>$('#app').classList.remove('open');
async function enter(){const n=$('#nick').value.trim().slice(0,20);if(!n)return $('#nick').focus();nick=n;ls.set('nick',n);await ready;
 $('#gate').hidden=true;$('#app').hidden=false;
 if(room){room.onPeers(c=>{lobby=c.peers.filter(p=>p.kind==='viewer'&&!p.presence.hidden);side()});room.presence({name:nick,voice:null,muted:false}).catch(()=>{})}
 open('txt',0)}
function side(){const c=$('#chs');c.replaceChildren(H('h2',0,'Texto'));
 TXT.forEach((n,i)=>{const b=H('button','ch'+(cur.t==='txt'&&cur.i===i?' on':''),'# '+n);b.onclick=()=>open('txt',i);c.append(b)});
 c.append(H('h2',0,'Voz'));
 VOZ.forEach((n,i)=>{const b=H('button','ch'+(cur.t==='voz'&&cur.i===i?' on':''),'🔊 '+n);b.onclick=()=>open('voz',i);c.append(b);
  const w=H('div','who');lobby.filter(p=>p.presence.voice===i).forEach(p=>{const r=H('i');r.append(H('b'),H('span',0,nm(p)+(p.presence.muted?' (mudo)':'')));w.append(r)});if(w.children.length)c.append(w)});
 $('#online').textContent=lobby.length?lobby.length+' online':'';
 const d=$('#dock');d.replaceChildren(H('div',0,'Você: '+nick));
 if(call){const b=H('button',0,'Voltar à call: '+VOZ[call.i]);b.onclick=()=>open('voz',call.i);d.append(b)}
 if(cur.t==='voz')callView()}
function open(t,i){cur={t,i};$('#app').classList.remove('open');$('#title').textContent=t==='txt'?'# '+TXT[i]:VOZ[i];
 $('#chat').hidden=t!=='txt';$('#call').classList.toggle('on',t==='voz');if(t==='txt')watch();side()}
function watch(){unsub&&unsub();unsub=null;const m=$('#msgs');m.replaceChildren();let first=true;
 if(!db){m.append(H('p','empty','Chat indisponível aqui. Recarregue a página.'));return}
 unsub=db.collection('channels/'+TXT[cur.i]+'/messages').orderBy('ts','desc').limit(80).onSnapshot(s=>{
  const near=m.scrollHeight-m.scrollTop-m.clientHeight<120,d=s.docs.map(x=>x.data()).reverse();m.replaceChildren();
  if(!d.length)m.append(H('p','empty','Nada por aqui ainda. Manda a primeira mensagem.'));
  d.forEach(x=>{const n=String(x.name||'?').slice(0,20),r=H('div','msg'),b=H('div'),h=H('b',0,n);
   h.append(H('time',0,new Date(+x.ts||0).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})));
   b.append(h,H('p',0,String(x.text||'').slice(0,2000)));r.append(av(n),b);m.append(r)});
  if(near||first)m.scrollTop=m.scrollHeight;first=false},
  ()=>m.replaceChildren(H('p','empty','Não deu pra carregar as mensagens. Tente recarregar a página.')))}
async function send(){const v=$('#txt').value.trim();if(!v||!db||cur.t!=='txt')return;$('#txt').value='';
 try{await db.collection('channels/'+TXT[cur.i]+'/messages').add({name:nick,text:v.slice(0,2000),ts:Date.now()})}
 catch(e){$('#txt').value=v;toast('Não foi possível enviar. Quem criou o app precisa liberar permissão de colaborador pra você.')}}
$('#snd').onclick=send;$('#txt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};

function callView(){const on=!!call&&call.i===cur.i;$('#idle').hidden=on;$('#live').hidden=!on;if(on)return;
 const n=lobby.filter(p=>p.presence.voice===cur.i).length;
 $('#idletxt').textContent=n?n+(n>1?' pessoas na call agora.':' pessoa na call agora.'):'Ninguém na call ainda.';
 $('#join').textContent=call?'Trocar pra esta sala':'Entrar na call'}
$('#join').onclick=async()=>{if(call)await leave();joinCall(cur.i)};
async function zip(s){try{const u=new Uint8Array(await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());return 'z'+btoa(String.fromCharCode(...u))}catch(e){return 'r'+s}}
async function unzip(v){if(v[0]==='r')return v.slice(1);const u=Uint8Array.from(atob(v.slice(1)),c=>c.charCodeAt(0));return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text()}
async function joinCall(i){
 if(!room)return toast('Calls indisponíveis. Recarregue a página.');
 if(!navigator.mediaDevices||!window.RTCPeerConnection)return toast('Este navegador não suporta calls.');
 let mic=null;try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Sem acesso ao microfone. Você entra só ouvindo.')}
 let r;try{r=await room.join('voz-'+i)}catch(e){mic&&mic.getTracks().forEach(t=>t.stop());return toast('Não foi possível entrar na sala de voz. Tente de novo.')}
 const c=call={i,r,mic,screen:null,pcs:new Map(),tiles:new Map(),off:[],muted:false,id:null};
 $('#mute').disabled=!mic;$('#mute').textContent='Silenciar microfone';$('#mute').classList.remove('act');
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{c.wl=l}).catch(()=>{})}catch(e){}
 c.off.push(r.on('sig',m=>onSig(c,m)));
 c.off.push(r.onPeers(ch=>{const me=ch.peers.find(p=>p.isMe&&p.sameTab);if(me)c.id=me.peer;
  ch.peers.forEach(p=>{if(!p.isMe&&p.kind==='viewer'&&c.id&&!c.pcs.has(p.peer))mk(c,p.peer)});
  [...c.pcs.keys()].forEach(k=>{if(!ch.peers.some(p=>p.peer===k))drop(c,k)});people(c)}));
 r.presence({name:nick}).catch(()=>{});room.presence({voice:i,muted:false}).catch(()=>{});open('voz',i)}
function mk(c,pid){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}),s={pc,polite:c.id>pid,making:false,ignore:false,ss:[],q:[]};c.pcs.set(pid,s);
 c.mic&&c.mic.getTracks().forEach(t=>pc.addTrack(t,c.mic));
 c.screen&&c.screen.getTracks().forEach(t=>s.ss.push(pc.addTrack(t,c.screen)));
 pc.onnegotiationneeded=async()=>{try{s.making=true;await pc.setLocalDescription();await sig(c,pid,'d',pc.localDescription)}catch(e){console.warn(e)}finally{s.making=false}};
 pc.onicecandidate=e=>{if(e.candidate)sig(c,pid,'c',e.candidate.toJSON())};
 pc.ontrack=e=>{if(e.streams[0])tile(c,pid,e.streams[0])};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')pc.restartIce()};
 return s}
async function sig(c,to,k,o){let v=JSON.stringify(o);if(k==='d')v=await zip(v);try{await c.r.emit('sig',{to,k,v})}catch(e){console.warn(e)}}
async function onSig(c,m){const d=m.data;if(m.isMe||!d||!c.id||d.to!==c.id)return;const s=c.pcs.get(m.peer)||mk(c,m.peer),pc=s.pc;
 try{if(d.k==='d'){const o=JSON.parse(await unzip(d.v)),clash=o.type==='offer'&&(s.making||pc.signalingState!=='stable');s.ignore=!s.polite&&clash;if(s.ignore)return;
   await pc.setRemoteDescription(o);for(const x of s.q.splice(0))await pc.addIceCandidate(x).catch(()=>{});
   if(o.type==='offer'){await pc.setLocalDescription();await sig(c,m.peer,'d',pc.localDescription)}}
  else if(d.k==='c'){const x=JSON.parse(d.v);if(!pc.remoteDescription)s.q.push(x);else await pc.addIceCandidate(x).catch(e=>{if(!s.ignore)throw e})}}
 catch(e){console.warn(e)}}
function tile(c,pid,st){const k=pid+st.id;let t=c.tiles.get(k);
 if(!t){const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.srcObject=st;v.play().catch(()=>{});
  const p=c.r.peers().find(x=>x.peer===pid);t=H('div','tile hid');t.append(v,H('span',0,'Tela de '+nm(p)));
  t.onclick=()=>t.requestFullscreen&&t.requestFullscreen();$('#screens').append(t);c.tiles.set(k,t);
  t._f=()=>{t.classList.toggle('hid',!st.getVideoTracks().length);if(!st.getTracks().length){t.remove();c.tiles.delete(k)}};
  st.onaddtrack=t._f;st.onremovetrack=t._f}
 t._f()}
function drop(c,pid){const s=c.pcs.get(pid);if(s){s.pc.close();c.pcs.delete(pid)}for(const [k,t] of c.tiles)if(k.startsWith(pid)){t.remove();c.tiles.delete(k)}}
function people(c){const e=$('#people');e.replaceChildren();
 c.r.peers().filter(p=>p.kind==='viewer'&&!p.presence.hidden).forEach(p=>{const n=nm(p),x=H('div','pp');
  x.append(av(n),H('span',0,n+(p.isMe&&p.sameTab?' (você)':'')+(p.presence.muted?' · mudo':'')+(p.presence.sharing?' · transmitindo':'')));e.append(x)})}
$('#mute').onclick=()=>{if(!call)return;const m=!call.muted;call.muted=m;call.mic&&call.mic.getAudioTracks().forEach(t=>t.enabled=!m);
 $('#mute').textContent=m?'Ativar microfone':'Silenciar microfone';$('#mute').classList.toggle('act',m);call.r.presence({muted:m});room.presence({muted:m})};
$('#share').onclick=async()=>{if(!call)return;
 if(window.Android&&Android.startShare){if(call.native){Android.stopShare();return}
  call.native=true;Android.startShare('voz-'+call.i,nick);$('#share').textContent='Parar de compartilhar';$('#share').classList.add('act');call.r.presence({sharing:true});return}
 if(call.screen)return stopShare();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return toast('Compartilhar tela só funciona no navegador do computador.');
 try{const s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});call.screen=s;s.getVideoTracks()[0].onended=stopShare;
  call.pcs.forEach(x=>s.getTracks().forEach(t=>x.ss.push(x.pc.addTrack(t,s))));
  const v=document.createElement('video');v.srcObject=s;v.muted=true;v.autoplay=true;v.playsInline=true;
  const t=H('div','tile');t.id='mine';t.append(v,H('span',0,'Sua tela'));$('#screens').prepend(t);
  $('#share').textContent='Parar de compartilhar';$('#share').classList.add('act');call.r.presence({sharing:true})}
 catch(e){toast('Não foi possível compartilhar a tela. Confira a permissão do navegador.')}};
function stopShare(){const c=call;if(!c||!c.screen)return;c.screen.getTracks().forEach(t=>t.stop());
 c.pcs.forEach(x=>{x.ss.forEach(se=>{try{x.pc.removeTrack(se)}catch(e){}});x.ss=[]});c.screen=null;
 const m=$('#mine');m&&m.remove();$('#share').textContent='Compartilhar tela';$('#share').classList.remove('act');c.r.presence({sharing:null})}
async function leave(){const c=call;if(!c)return;stopShare();if(c.native){c.native=false;try{Android.stopShare()}catch(e){}}call=null;c.off.forEach(f=>f());try{c.wl&&c.wl.release().catch(()=>{})}catch(e){}c.pcs.forEach(x=>x.pc.close());c.pcs.clear();
 c.tiles.forEach(t=>t.remove());c.tiles.clear();c.mic&&c.mic.getTracks().forEach(t=>t.stop());$('#people').replaceChildren();
 try{await c.r.leave()}catch(e){}room&&room.presence({voice:null,muted:false}).catch(()=>{});side()}
$('#leave').onclick=leave;
window.onNativeShareStopped=()=>{const c=call;if(c&&c.native){c.native=false;$('#share').textContent='Compartilhar tela';$('#share').classList.remove('act');c.r.presence({sharing:null})}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
